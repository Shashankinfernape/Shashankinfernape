<svg width="820" height="230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg-grad-chatflix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#232326"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
    <!-- Subtle inner glow for glass feel -->
    <linearGradient id="hl-grad-chatflix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow-chatflix" x="-3%" y="-3%" width="106%" height="118%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="rgba(0,0,0,0.55)"/>
    </filter>
    
  </defs>

  <!-- Main card body -->
  <rect x="8" y="8" width="804" height="214"
    rx="22" fill="url(#bg-grad-chatflix)"
    stroke="rgba(255,255,255,0.10)" stroke-width="1.5"
    filter="url(#shadow-chatflix)"/>

  <!-- Top glass sheen -->
  <rect x="8" y="8" width="804" height="107"
    rx="22" fill="url(#hl-grad-chatflix)"/>

  <!-- Hairline top border highlight -->
  <rect x="9.5" y="9.5" width="801" height="4" rx="4" fill="rgba(255,255,255,0.5)"/>

  <!-- Logo or BG -->
  

  <!-- Action icon pill (top right) -->
  <a href="https://github.com/Shashankinfernape/Chatflix">
    <rect x="744" y="14" width="62" height="32" rx="16" fill="rgba(67,160,71,0.10)"/>
    <g transform="translate(756, 18) scale(0.83)">
      <path d="M3.9,12C3.9,10.29 5.29,8.9 7,8.9H11V7H7A5,5 0 0,0 2,12A5,5 0 0,0 7,17H11V15.1H7C5.29,15.1 3.9,13.71 3.9,12M8,13H16V11H8V13M17,7H13V8.9H17C18.71,8.9 20.1,10.29 20.1,12C20.1,13.71 18.71,15.1 17,15.1H13V17H17A5,5 0 0,0 22,12A5,5 0 0,0 17,7Z" fill="#43A047"/>
    </g>
  </a>

  <!-- Project title -->
  <text x="34" y="52"
    font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Roboto,sans-serif"
    font-size="22" font-weight="800" fill="#f5f5f7" letter-spacing="0.4">❖ CHATFLIX</text>

  <!-- Description text -->
  <g transform="translate(34, 68)">
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="42">A full-stack real-time messaging ecosystem featuring a</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="66">Netflix-inspired interface. Powered by advanced JWT</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="90">authentication protocols and seamless Socket.io</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="114">integration.</text>
  </g>
</svg>