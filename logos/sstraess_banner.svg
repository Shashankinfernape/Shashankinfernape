<svg width="820" height="230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg-grad-sstraess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#232326"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
    <!-- Subtle inner glow for glass feel -->
    <linearGradient id="hl-grad-sstraess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow-sstraess" x="-3%" y="-3%" width="106%" height="118%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="rgba(0,0,0,0.55)"/>
    </filter>
    
  </defs>

  <!-- Main card body -->
  <rect x="8" y="8" width="804" height="214"
    rx="22" fill="url(#bg-grad-sstraess)"
    stroke="rgba(255,255,255,0.10)" stroke-width="1.5"
    filter="url(#shadow-sstraess)"/>

  <!-- Top glass sheen -->
  <rect x="8" y="8" width="804" height="107"
    rx="22" fill="url(#hl-grad-sstraess)"/>

  <!-- Hairline top border highlight -->
  <rect x="9.5" y="9.5" width="801" height="4" rx="4" fill="rgba(255,255,255,0.5)"/>

  <!-- Logo or BG -->
  

  <!-- Action icon pill (top right) -->
  <a href="https://github.com/Shashankinfernape/SSTRAESS/releases/latest">
    <rect x="744" y="14" width="62" height="32" rx="16" fill="rgba(25,118,210,0.10)"/>
    <g transform="translate(756, 18) scale(0.83)">
      <path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" fill="#1976D2"/>
    </g>
  </a>

  <!-- Project title -->
  <text x="34" y="52"
    font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Roboto,sans-serif"
    font-size="22" font-weight="800" fill="#f5f5f7" letter-spacing="0.4">❖ SSTRAESS</text>

  <!-- Description text -->
  <g transform="translate(34, 68)">
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="42">High-intensity load testing and system stress simulation</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="66">architectural framework. Features modernized UI tracking</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif" font-size="15" fill="#8e8e93" font-weight="450" x="0" y="90">mechanisms to monitor active system threshold limits.</text>
  </g>
</svg>