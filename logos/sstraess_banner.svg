<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Glassy Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Dark Mode Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="100%" stop-color="#151516" />
    </linearGradient>

    <!-- Light Mode Gradient (Handesk) -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f2f5" />
    </linearGradient>

    <style>
      .title-dark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
      .desc-dark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #a1a1a6; line-height: 1.5; font-weight: 500; }
      .bg-text-dark { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 130px; font-weight: 900; fill: rgba(255, 255, 255, 0.04); }
      
      .title-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #1d1d1f; letter-spacing: 0.5px; }
      .desc-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #515154; line-height: 1.5; font-weight: 500; }
      .bg-text-light { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 130px; font-weight: 900; fill: rgba(0, 0, 0, 0.05); }
    </style>
  </defs>

  <!-- Glassy Base -->
  <rect x="10" y="10" width="780" height="180" fill="url(#bg-dark)" rx="20" filter="url(#shadow)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Inner Highlight for Glassy Apple look -->
  <path d="M 30 11 L 770 11 C 780.5 11 789 19.5 789 30 L 789 50 C 789 19.5 780.5 11 770 11 L 30 11 C 19.5 11 11 19.5 11 30 L 11 50 C 11 19.5 19.5 11 30 11 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Background Watermark -->
  <text class="bg-text-dark" x="150" y="145">SSTRAESS</text>

  <!-- Foreground Text -->
  <g transform="translate(45, 75)">
    <text class="title-dark" x="0" y="0">❖ SSTRAESS</text>
    <text class="desc-dark" x="0" y="38">High-intensity load testing and system stress simulation architectural framework. Features modernized</text>
    <text class="desc-dark" x="0" y="63">UI tracking mechanisms to monitor active system threshold limits.</text>
  </g>
</svg>