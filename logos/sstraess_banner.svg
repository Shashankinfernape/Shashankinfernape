<svg width="820" height="230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Base Card Clip Path -->
    <clipPath id="card-clip-sstraess">
      <rect x="8" y="8" width="804" height="214" rx="22"/>
    </clipPath>

    <!-- Gradients and Shadows -->
    <linearGradient id="bg-grad-sstraess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#232326"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
    <filter id="shadow-sstraess" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- 1. Drop Shadow & Base Glass Layer -->
  <rect x="8" y="8" width="804" height="214"
    rx="22" fill="url(#bg-grad-sstraess)"
    filter="url(#shadow-sstraess)"/>

  <!-- 2. Premium Background Watermarks (Logos / Title) -->
  <text x="410" y="125" text-anchor="middle" dominant-baseline="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="160" font-weight="900" fill="rgba(255,255,255,0.04)" clip-path="url(#card-clip-sstraess)">SSTRAESS</text>

  <!-- 3. Foreground Sharp Logo (if applicable) -->
  

  <!-- 5. Action Pill (Top Right) -->
  <a href="https://github.com/Shashankinfernape/SSTRAESS/releases/latest">
    <rect x="744" y="16" width="60" height="34" rx="17" fill="rgba(0,122,255,0.12)"/>
    <g transform="translate(757, 21) scale(0.85)">
      <path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" fill="#007AFF"/>
    </g>
  </a>

  <!-- 6. Title and Description -->
  <text x="35" y="50"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', sans-serif"
    font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1">❖ SSTRAESS</text>
  
  <g transform="translate(35, 70)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" fill="#a1a1a6" font-weight="400" letter-spacing="0.2" x="0" y="42">High-intensity load testing and system stress simulation</text>
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" fill="#a1a1a6" font-weight="400" letter-spacing="0.2" x="0" y="66">architectural framework. Features modernized UI tracking</text>
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="15" fill="#a1a1a6" font-weight="400" letter-spacing="0.2" x="0" y="90">mechanisms to monitor active system threshold limits.</text>
  </g>
</svg>